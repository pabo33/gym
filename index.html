<style>
  /* ------------------------------------------------------------------
     Tokens. Ein Akzent (Signalorange), kühle Neutraltöne, zwei Radien:
     große Flächen und Buttons 20px, kleine Elemente (<= 48px) 12px.
     ------------------------------------------------------------------ */
  :root {
    --bg: #F2F2F4;
    --surface: #FBFBFC;
    --surface-2: #E6E6EA;
    --fg: #111114;
    --muted: #5C5C66;
    --faint: #A6A6B0;
    --line: #DDDDE2;
    --accent: #F25A1D;
    --on-accent: #111114;
    --accent-soft: rgba(242, 90, 29, 0.13);
    --tabbar-bg: rgba(242, 242, 244, 0.8);
    --shadow: 0 1px 0 rgba(17, 17, 20, 0.03), 0 10px 24px -14px rgba(17, 17, 20, 0.16);

    --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Segoe UI", Roboto, sans-serif;
    --rounded: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, system-ui, "Segoe UI", sans-serif;

    --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
    --ease-drawer: cubic-bezier(0.32, 0.72, 0, 1);

    --r: 20px;
    --r-sm: 12px;
    --tabbar-h: 58px;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --ring: min(80vw, 44vh, 340px);
  }
  @supports (height: 1dvh) {
    :root { --ring: min(80vw, 44dvh, 340px); }
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0B0B0D;
      --surface: #17171B;
      --surface-2: #232329;
      --fg: #F2F2F4;
      --muted: #9D9DA8;
      --faint: #55555F;
      --line: #2A2A31;
      --accent: #FF6A2B;
      --on-accent: #111114;
      --accent-soft: rgba(255, 106, 43, 0.16);
      --tabbar-bg: rgba(11, 11, 13, 0.76);
      --shadow: 0 0 0 0 transparent;
    }
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--sans);
    font-size: 17px;
    line-height: 1.35;
    -webkit-font-smoothing: antialiased;
    -webkit-text-size-adjust: 100%;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    overflow: hidden;
    overscroll-behavior: none;
  }
  button, a { font: inherit; color: inherit; background: none; border: 0; text-decoration: none; cursor: pointer; }
  button, a, label, .panel { touch-action: manipulation; }
  :focus { outline: none; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

  /* Gemeinsames Druck-Feedback für alles Antippbare */
  .press { transition: transform 140ms var(--ease-out); }
  .press:active { transform: scale(0.97); }

  /* ------------------------------ Shell ------------------------------ */
  .app {
    position: fixed;
    inset: 0;
    max-width: 520px;
    margin: 0 auto;
  }
  .panel {
    position: absolute;
    inset: 0;
    overflow-y: auto;
    overscroll-behavior: contain;
    -webkit-overflow-scrolling: touch;
    padding: calc(var(--safe-top) + 14px) 18px calc(var(--tabbar-h) + var(--safe-bottom) + 28px);
    visibility: hidden;
  }
  .panel.is-active { visibility: visible; }

  .head {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 12px;
    margin: 6px 2px 18px;
  }

<script>
(() => {
  'use strict';

  /* =================================================================
     Konfiguration: hier anpassen
     ================================================================= */
  const REST_SECONDS = 180;                                     // Pausenlänge (3 Minuten)
  const SHORTCUT_URL = 'shortcuts://run-shortcut?name=Vibrieren'; // iOS-Kurzbefehl bei 0:00
  const SETS_PER_EXERCISE = 3;

  const WORKOUTS = {
    torso: { name: 'Torso', exercises: ['Butterfly', 'Klimmzüge', 'Schulterpresse', 'T-Bar-Rudern', 'Lateral Raises', 'Brustpresse'] },
    limbs: { name: 'Limbs', exercises: ['Bizeps', 'Trizeps', 'Beinpresse', 'Leg Curls', 'Waden', 'Bauch'] },
  };
  const CYCLE = ['torso', 'limbs', 'torso', 'limbs'];            // Tag 1 bis 4, danach wieder Tag 1

  const STORAGE_KEY = 'gym-app/v1';
  const LIVE_WINDOW_MS = 3000;          // Kurzbefehl nur automatisch auslösen, wenn 0:00 gerade eben erreicht wurde
  const DONE_EXPIRY_MS = 15 * 60 * 1000; // lange abgelaufener Timer zeigt beim Öffnen wieder 3:00

  /* =================================================================
     Zustand + localStorage
     ================================================================= */
  const DATE_RE = /^\d{4}-\d{2}-\d{2}$/;

  function loadState() {
    const s = { rotation: 1, checks: [], checksFor: 1, log: [], timerEnd: null, firedFor: null };
    let raw = null;
    try { raw = JSON.parse(localStorage.getItem(STORAGE_KEY)); } catch (_) { raw = null; }
    if (!raw || typeof raw !== 'object') return s;

    const r = Number(raw.rotation);
    if (Number.isInteger(r) && r >= 1 && r <= CYCLE.length) s.rotation = r;

    if (Array.isArray(raw.log)) {
      s.log = raw.log
        .map(e => (typeof e === 'string' ? { date: e, day: null } : e))
        .filter(e => e && typeof e.date === 'string' && DATE_RE.test(e.date))
        .map(e => ({ date: e.date, day: Number.isInteger(e.day) ? e.day : null }));
    }

    // Haken gehören immer zu genau einem Trainingstag
    if (Array.isArray(raw.checks) && raw.checksFor === s.rotation) {
      const names = WORKOUTS[CYCLE[s.rotation - 1]].exercises;
      s.checks = raw.checks.filter(n => names.includes(n));
    }
    s.checksFor = s.rotation;

    if (typeof raw.timerEnd === 'number' && isFinite(raw.timerEnd)) s.timerEnd = raw.timerEnd;
    if (typeof raw.firedFor === 'number') s.firedFor = raw.firedFor;
    return s;
  }

  function save() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (_) { /* Speicher voll oder blockiert */ }
  }

  const state = loadState();
  save();
  try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (_) {}

  const workoutFor = day => WORKOUTS[CYCLE[day - 1]];
  const nextDay = day => (day % CYCLE.length) + 1;

  /* =================================================================
     Helfer
     ================================================================= */
  const $ = id => document.getElementById(id);
  const pad = n => String(n).padStart(2, '0');
  const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; // lokales Datum, nicht UTC
  const parseYmd = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d, 12); };
  const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const reduceMotion = () => window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  const fmtMonthYear = new Intl.DateTimeFormat('de-DE', { month: 'long', year: 'numeric' });
  const fmtMonth = new Intl.DateTimeFormat('de-DE', { month: 'long' });
  const fmtDay = new Intl.DateTimeFormat('de-DE', { weekday: 'long', day: 'numeric', month: 'long' });

  // Haptisches Tick auf iOS 18+ (Switch-Trick), Vibration API auf Android. Wirkt nur bei direkter Nutzerinteraktion.
  function haptic() {
    try {
      if (navigator.vibrate) { navigator.vibrate(12); return; }
      const label = document.createElement('label');
      label.ariaHidden = 'true';
      label.style.display = 'none';
      const input = document.createElement('input');
      input.type = 'checkbox';
      input.setAttribute('switch', '');
      label.appendChild(input);
      document.head.appendChild(label);
      label.click();
      label.remove();
    } catch (_) {}
  }

  // iOS braucht einen touchstart-Listener, damit :active beim Antippen greift
  document.addEventListener('touchstart', () => {}, { passive: true });

  /* =================================================================
     Tabs
     ================================================================= */
  const tabs = [...document.querySelectorAll('.tab')];
  const panels = { timer: $('panel-timer'), plan: $('panel-plan'), journal: $('panel-journal') };

  function showTab(id) {
    tabs.forEach(t => {
      const on = t.dataset.tab === id;
      t.setAttribute('aria-selected', String(on));
      t.tabIndex = on ? 0 : -1;
    });
    Object.entries(panels).forEach(([key, el]) => {
      const on = key === id;
      el.classList.toggle('is-active', on);
      el.inert = !on;
    });
    if (id === 'journal') renderJournal();
  }
  tabs.forEach(t => t.addEventListener('click', () => showTab(t.dataset.tab)));
  $('ctx').addEventListener('click', () => showTab('plan'));

  /* =================================================================
     Timer (zeitstempelbasiert, läuft auch nach Neustart der App weiter)
     ================================================================= */
  const TOTAL_MS = REST_SECONDS * 1000;
  const CIRC = 2 * Math.PI * 90;
  const timerPanel = $('panel-timer');
  const ringBar = $('ring-bar');
  const timeEl = $('time');
  const statusEl = $('status');
  const vibBtn = $('vib');
  const tabTimerLabel = $('tab-timer-label');

  ringBar.style.strokeDasharray = String(CIRC);
  vibBtn.href = SHORTCUT_URL;

  let raf = 0;
  let endTimer = 0;
  let mode = 'idle';
  let shownP = 1;
  let shownText = '';
  let refill = null;
  let wakeLock = null;

  const fmtTime = ms => {
    const s = Math.max(0, Math.ceil(ms / 1000));
    return `${Math.floor(s / 60)}:${pad(s % 60)}`;
  };

  function drawRing(p) {
    shownP = p;
    ringBar.style.strokeDashoffset = String(CIRC * (1 - p));
    ringBar.style.opacity = p <= 0.001 ? '0' : '1';
  }

  function drawTime(ms) {
    const text = fmtTime(ms);
    if (text === shownText) return;
    shownText = text;
    timeEl.textContent = text;
    tabTimerLabel.textContent = mode === 'running' ? text : 'Timer';
  }

  function setMode(m) {
    mode = m;
    timerPanel.classList.toggle('is-running', m === 'running');
    timerPanel.classList.toggle('is-done', m === 'done');
    statusEl.textContent = m === 'running' ? 'Pause läuft' : m === 'done' ? 'Pause vorbei' : 'Bereit';
    vibBtn.setAttribute('aria-hidden', String(m !== 'done'));
    vibBtn.tabIndex = m === 'done' ? 0 : -1;
    shownText = '';
    if (m !== 'running') tabTimerLabel.textContent = 'Timer';
  }

  function frame() {
    const now = Date.now();
    const remaining = state.timerEnd - now;
    if (remaining <= 0) { finish(now - state.timerEnd <= LIVE_WINDOW_MS); return; }

    let p = remaining / TOTAL_MS;
    if (refill) {
      const t = Math.min(1, (now - refill.t0) / 420);
      const e = 1 - Math.pow(1 - t, 3);
      p = refill.from + (p - refill.from) * e;
      if (t >= 1) refill = null;
    }
    drawRing(Math.min(1, p));
    drawTime(remaining);
    raf = requestAnimationFrame(frame);
  }

  // Absicherung, falls requestAnimationFrame gedrosselt wird: exakt zum Ende einmal prüfen
  function scheduleEnd() {
    clearTimeout(endTimer);
    endTimer = setTimeout(() => {
      if (mode !== 'running' || Date.now() < state.timerEnd) return;
      const live = document.visibilityState === 'visible' && Date.now() - state.timerEnd <= LIVE_WINDOW_MS;
      finish(live);
    }, Math.max(0, state.timerEnd - Date.now()) + 30);
  }

  function start() {
    haptic();
    const from = shownP;
    state.timerEnd = Date.now() + TOTAL_MS;
    state.firedFor = null;
    save();
    refill = !reduceMotion() && from < 0.995 ? { from, t0: Date.now() } : null;
    setMode('running');
    requestWakeLock();
    cancelAnimationFrame(raf);
    scheduleEnd();
    frame();
  }

  function finish(live) {
    cancelAnimationFrame(raf);
    clearTimeout(endTimer);
    refill = null;
    setMode('done');
    drawRing(0);
    drawTime(0);
    releaseWakeLock();
    if (live && state.firedFor !== state.timerEnd) {
      state.firedFor = state.timerEnd;
      save();
      triggerShortcut();
    }
  }

  function toIdle() {
    cancelAnimationFrame(raf);
    clearTimeout(endTimer);
    setMode('idle');
    drawRing(1);
    drawTime(TOTAL_MS);
  }

  function triggerShortcut() {
    // Kann von iOS ohne direkte Nutzerinteraktion blockiert werden. Dafür gibt es den Button.
    try { window.location.href = SHORTCUT_URL; } catch (_) {}
  }

  function syncTimer() {
    cancelAnimationFrame(raf);
    const end = state.timerEnd;
    if (!end) { toIdle(); return; }
    const over = Date.now() - end;
    if (over < 0) {
      if (mode !== 'running') setMode('running');
      requestWakeLock();
      scheduleEnd();
      frame();
    } else if (over > DONE_EXPIRY_MS) {
      state.timerEnd = null;
      save();
      toIdle();
    } else {
      finish(over <= LIVE_WINDOW_MS);
    }
  }

  // Bildschirm während der Pause wach halten, damit 0:00 live erreicht wird
  async function requestWakeLock() {
    try {
      if (!('wakeLock' in navigator) || wakeLock || document.visibilityState !== 'visible') return;
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => { wakeLock = null; });
    } catch (_) { wakeLock = null; }
  }
  function releaseWakeLock() {
    try { if (wakeLock) wakeLock.release(); } catch (_) {}
    wakeLock = null;
  }

  $('start').addEventListener('click', start);
  vibBtn.addEventListener('click', () => haptic());

  /* =================================================================
     Trainingsplan
     ================================================================= */
  const cycleEl = $('cycle');
  const listEl = $('exercises');
  const completeBtn = $('complete');

  function renderPlan(animate) {
    const day = state.rotation;
    const w = workoutFor(day);

    $('plan-sub').textContent = `Tag ${day} von ${CYCLE.length}`;
    $('plan-title').textContent = w.name;

    cycleEl.innerHTML = CYCLE.map((key, i) => {
      const n = i + 1;
      const cls = n === day ? 'is-current' : n < day ? 'is-past' : '';
      return `<li class="step ${cls}"${n === day ? ' aria-current="step"' : ''}>` +
        `<span class="step-n">${n}</span><span class="step-l">${WORKOUTS[key].name}</span></li>`;
    }).join('');

    listEl.innerHTML = w.exercises.map(name => {
      const checked = state.checks.includes(name) ? ' checked' : '';
      return `<li><label class="ex press">` +
        `<input type="checkbox" data-name="${esc(name)}"${checked}>` +
        `<span class="box" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.2 4.2L19 7"/></svg></span>` +
        `<span class="ex-name">${esc(name)}</span>` +
        `<span class="ex-sets">${SETS_PER_EXERCISE} Sätze</span>` +
        `</label></li>`;
    }).join('');

    $('hint').textContent = `Trägt heute ins Journal ein und wechselt zu Tag ${nextDay(day)}.`;
    renderProgress();

    if (animate && !reduceMotion()) {
      [...listEl.children].forEach((li, i) => {
        li.animate(
          [{ opacity: 0, transform: 'translateY(10px)' }, { opacity: 1, transform: 'none' }],
          { duration: 320, delay: i * 45, easing: 'cubic-bezier(0.23, 1, 0.32, 1)', fill: 'backwards' }
        );
      });
    }
  }

  function renderProgress() {
    const day = state.rotation;
    const w = workoutFor(day);
    const total = w.exercises.length;
    const done = w.exercises.filter(n => state.checks.includes(n)).length;

    $('plan-count').innerHTML = `<b>${done}</b>/${total}`;
    completeBtn.classList.toggle('is-ready', done === total);

    $('ctx-day').innerHTML = `Tag ${day} <span>· ${esc(w.name)}</span>`;
    $('ctx-count').textContent = `${done}/${total}`;
    $('ctx-segs').innerHTML = w.exercises.map(n => `<i${state.checks.includes(n) ? ' class="on"' : ''}></i>`).join('');
  }

  listEl.addEventListener('change', e => {
    const input = e.target.closest('input[type="checkbox"]');
    if (!input) return;
    const name = input.dataset.name;
    state.checks = state.checks.filter(n => n !== name);
    if (input.checked) state.checks.push(name);
    state.checksFor = state.rotation;
    save();
    haptic();
    renderProgress();
  });

  completeBtn.addEventListener('click', () => {
    haptic();
    const snapshot = JSON.stringify({ rotation: state.rotation, checks: state.checks, checksFor: state.checksFor, log: state.log });
    const doneDay = state.rotation;

    state.log.push({ date: ymd(new Date()), day: doneDay });
    state.rotation = nextDay(doneDay);
    state.checks = [];
    state.checksFor = state.rotation;
    save();

    const now = new Date();
    calYear = now.getFullYear();
    calMonth = now.getMonth();
    selectedDate = null;

    panels.plan.scrollTo({ top: 0, behavior: reduceMotion() ? 'auto' : 'smooth' });
    renderPlan(true);
    renderJournal();

    showToast(`Tag ${doneDay} eingetragen. Weiter mit Tag ${state.rotation}, ${workoutFor(state.rotation).name}.`, () => {
      Object.assign(state, JSON.parse(snapshot));
      save();
      renderPlan(true);
      renderJournal();
    });
  });

  /* =================================================================
     Journal + Kalender
     ================================================================= */
  const calGrid = $('cal-grid');
  let calYear = new Date().getFullYear();
  let calMonth = new Date().getMonth();
  let selectedDate = null;

  function entriesByDate() {
    const map = new Map();
    state.log.forEach(e => {
      if (!map.has(e.date)) map.set(e.date, []);
      map.get(e.date).push(e.day);
    });
    return map;
  }

  function mondayOf(d) {
    const x = new Date(d.getFullYear(), d.getMonth(), d.getDate(), 12);
    x.setDate(x.getDate() - ((x.getDay() + 6) % 7));
    return x;
  }

  function weekStreak(dates) {
    const weeks = new Set(dates.map(s => ymd(mondayOf(parseYmd(s)))));
    const cur = mondayOf(new Date());
    if (!weeks.has(ymd(cur))) cur.setDate(cur.getDate() - 7); // laufende Woche zählt erst, wenn trainiert wurde
    let n = 0;
    while (weeks.has(ymd(cur))) { n++; cur.setDate(cur.getDate() - 7); }
    return n;
  }

  function renderJournal(dir = 0) {
    const byDate = entriesByDate();
    const dates = [...byDate.keys()];
    const today = ymd(new Date());
    const monthPrefix = `${calYear}-${pad(calMonth + 1)}-`;
    const first = new Date(calYear, calMonth, 1, 12);

    // Statistik
    const inMonth = dates.filter(d => d.startsWith(monthPrefix)).length;
    const streak = weekStreak(dates);
    $('stat-month').textContent = inMonth;
    $('stat-month-label').textContent = `${inMonth === 1 ? 'Trainingstag' : 'Trainingstage'} im ${fmtMonth.format(first)}`;
    $('stat-streak').textContent = streak;
    $('stat-streak-label').textContent = streak === 1 ? 'Woche in Folge' : 'Wochen in Folge';
    $('stat-total').textContent = dates.length;
    $('stat-total-label').textContent = dates.length === 1 ? 'Tag gesamt' : 'Tage gesamt';

    // Kalender: immer 6 Wochen, damit die Höhe beim Blättern stabil bleibt
    $('cal-title').textContent = fmtMonthYear.format(first);
    const offset = (first.getDay() + 6) % 7;
    const cursor = new Date(calYear, calMonth, 1 - offset, 12);
    let html = '';
    for (let i = 0; i < 42; i++) {
      const key = ymd(cursor);
      const out = cursor.getMonth() !== calMonth;
      const gym = byDate.has(key);
      const cls = ['day', out && 'is-out', gym && 'is-gym', key === today && 'is-today', !out && key === selectedDate && 'is-selected']
        .filter(Boolean).join(' ');
      const label = fmtDay.format(cursor) + (gym ? ', Training' : '');
      html += `<button type="button" class="${cls}" data-date="${key}" aria-label="${label}"${out ? ' tabindex="-1" aria-hidden="true"' : ''}>${cursor.getDate()}</button>`;
      cursor.setDate(cursor.getDate() + 1);
    }
    calGrid.innerHTML = html;
    renderCaption(byDate, today);

    if (dir) {
      const frames = reduceMotion()
        ? [{ opacity: 0 }, { opacity: 1 }]
        : [{ opacity: 0, transform: `translateX(${dir * 18}px)` }, { opacity: 1, transform: 'none' }];
      calGrid.animate(frames, { duration: 240, easing: 'cubic-bezier(0.23, 1, 0.32, 1)' });
    }
  }

  function describeDays(days) {
    return days.map(d => (d ? `Tag ${d}, ${workoutFor(d).name}` : 'Training')).join(' und ');
  }

  function renderCaption(byDate, today) {
    const cap = $('cal-caption');
    const key = selectedDate || today;
    const days = byDate.get(key);
    if (key === today) {
      cap.innerHTML = days
        ? `Heute: <b>${esc(describeDays(days))}</b>`
        : 'Heute noch kein Training eingetragen.';
    } else {
      const label = esc(fmtDay.format(parseYmd(key)));
      cap.innerHTML = days ? `${label}: <b>${esc(describeDays(days))}</b>` : `${label}: kein Training`;
    }
  }

  function shiftMonth(delta) {
    const d = new Date(calYear, calMonth + delta, 1);
    calYear = d.getFullYear();
    calMonth = d.getMonth();
    selectedDate = null;
    renderJournal(delta);
  }

  $('cal-prev').addEventListener('click', () => shiftMonth(-1));
  $('cal-next').addEventListener('click', () => shiftMonth(1));
  $('cal-title').addEventListener('click', () => {
    const now = new Date();
    const delta = (now.getFullYear() - calYear) * 12 + (now.getMonth() - calMonth);
    calYear = now.getFullYear();
    calMonth = now.getMonth();
    selectedDate = null;
    renderJournal(Math.sign(delta));
  });

  calGrid.addEventListener('click', e => {
    const btn = e.target.closest('.day');
    if (!btn || btn.classList.contains('is-out')) return;
    const key = btn.dataset.date;
    selectedDate = selectedDate === key ? null : key;
    calGrid.querySelectorAll('.is-selected').forEach(el => el.classList.remove('is-selected'));
    if (selectedDate) btn.classList.add('is-selected');
    renderCaption(entriesByDate(), ymd(new Date()));
  });

  // Wischen zum Blättern
  let touchX = 0, touchY = 0, touchT = 0;
  const calEl = document.querySelector('.cal');
  calEl.addEventListener('touchstart', e => {
    const t = e.touches[0];
    touchX = t.clientX; touchY = t.clientY; touchT = Date.now();
  }, { passive: true });
  calEl.addEventListener('touchend', e => {
    const t = e.changedTouches[0];
    const dx = t.clientX - touchX;
    const dy = t.clientY - touchY;
    const velocity = Math.abs(dx) / Math.max(1, Date.now() - touchT);
    if (Math.abs(dx) > Math.abs(dy) * 1.4 && (Math.abs(dx) > 56 || (Math.abs(dx) > 24 && velocity > 0.35))) {
      shiftMonth(dx < 0 ? 1 : -1);
    }
  }, { passive: true });

  /* =================================================================
     Toast mit Rückgängig
     ================================================================= */
  const toast = $('toast');
  const toastBtn = $('toast-btn');
  let toastTimer = 0;
  let toastUndo = null;

  function showToast(message, onUndo) {
    $('toast-msg').textContent = message;
    toastUndo = onUndo;
    toast.classList.add('is-visible');
    toast.setAttribute('aria-hidden', 'false');
    toastBtn.tabIndex = 0;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(hideToast, 6000);
  }
  function hideToast() {
    clearTimeout(toastTimer);
    toast.classList.remove('is-visible');
    toast.setAttribute('aria-hidden', 'true');
    toastBtn.tabIndex = -1;
    toastUndo = null;
  }
  toastBtn.addEventListener('click', () => {
    const undo = toastUndo;
    haptic();
    hideToast();
    if (undo) undo();
  });

  /* =================================================================
     App-Lebenszyklus
     ================================================================= */
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') {
      syncTimer();
      if (panels.journal.classList.contains('is-active')) renderJournal();
      if (toastUndo) { clearTimeout(toastTimer); toastTimer = setTimeout(hideToast, 4000); }
    } else {
      cancelAnimationFrame(raf);
      clearTimeout(toastTimer);
    }
  });
  window.addEventListener('pageshow', e => { if (e.persisted) syncTimer(); });

  renderPlan(false);
  renderJournal();
  syncTimer();
})();
</script>
</body>
</html>
